<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="converter-cover">
        <header>Temperature Converter</header>
        <div class="converter-container">
            <div class="converter-second-container">
                <div class="each-div-cover">
                    <span class="temp-unit">Celsius:</span>
                    <span class="temp-output js-celsius-output"></span>
                    <input type="number" class="input-class js-celsius-input" placeholder="Enter Temperature">
                </div>
    
                <div class="each-div-cover">
                    <span class="temp-unit">Fahrenheit:</span>
                    <span class="temp-output js-fahrenheit-output"></span>
                    <input type="number" class="input-class js-fahrenheit-input" placeholder="Enter Temperature">
                </div>
    
                <div class="each-div-cover">
                    <span class="temp-unit">Kelvin:</span>
                    <span class="temp-output js-kelvin-output"></span>
                    <input type="number" class="input-class js-kelvin-input" placeholder="Enter Temperature">
                </div>
            </div>
        </div>
    </div>
    <script src="scripts/script.js"></script>
</body>
</html>
